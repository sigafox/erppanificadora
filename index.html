    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos personalizados e fallback de fonte */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Efeito de transição suave para feedback visual */
        .transition-all {
            transition: all 0.3s ease-in-out;
        }
        /* Para o modal não causar scroll na página */
        .modal-open {
            overflow: hidden;
        }
        /* Estilos para impressão do cupom fiscal */
        @media print {
            body * {
                visibility: hidden;
            }
            #cupom-fiscal-modal, #cupom-fiscal-modal * {
                visibility: visible;
            }
            #cupom-fiscal-modal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                border: none;
                box-shadow: none;
                background: white;
            }
            #cupom-content {
                color: black;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
